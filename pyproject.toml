[project]
name = "digitalcrimeportal"
version = "0.1.0"
description = "Real-time digital-arrest scam detection: LangGraph + RAG pipeline with multilingual citizen alerts, fraud-network graph intelligence and geospatial hotspot mapping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "faster-whisper>=1.2.1",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "mcp[cli]>=1.0.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.30.0",
]
